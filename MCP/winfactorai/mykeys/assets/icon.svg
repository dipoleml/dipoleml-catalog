<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7bff"/>
      <stop offset="1" stop-color="#0b2f9e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#sheen)"/>

  <!-- 保险库转盘：外环 + 8 个均匀刻度点 -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="10"/>
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="256" cy="84" r="9"/>
    <circle cx="374" cy="138" r="9"/>
    <circle cx="428" cy="256" r="9"/>
    <circle cx="374" cy="374" r="9"/>
    <circle cx="256" cy="428" r="9"/>
    <circle cx="138" cy="374" r="9"/>
    <circle cx="84" cy="256" r="9"/>
    <circle cx="138" cy="138" r="9"/>
  </g>

  <!-- 钥匙（几何中心对准画布中心，旋转 -45°） -->
  <g transform="rotate(-45 256 256)" stroke="#ffffff" stroke-linecap="round" fill="none">
    <circle cx="256" cy="170" r="44" stroke-width="30"/>
    <line x1="256" y1="218" x2="256" y2="392" stroke-width="34"/>
    <line x1="256" y1="336" x2="316" y2="336" stroke-width="28"/>
    <line x1="256" y1="388" x2="300" y2="388" stroke-width="28"/>
  </g>
</svg>
