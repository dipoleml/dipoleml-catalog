extends: default

ignore:
  - node_modules/
  - .claude/
  # SkillSpector-generated baselines: column-0 block sequences (valid YAML),
  # regenerated by `skillspector baseline` so not worth hand-formatting.
  - lab/skillspector/baselines/

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  truthy:
    allowed-values: ["true", "false", "on", "off"]
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: true
