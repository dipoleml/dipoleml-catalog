<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Trident SecOps Skills banner</title>
  <desc id="desc">Banner for Trident SecOps Skills: a trident emblem, the project name, and three compatibility badges marked Gemini CLI, Claude Code, and Codex.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040d18"/>
      <stop offset="45%" stop-color="#0a2133"/>
      <stop offset="100%" stop-color="#061d22"/>
    </linearGradient>
    <!-- userSpaceOnUse: the trident strokes are straight lines, so an
         objectBoundingBox gradient would collapse on their zero-area boxes -->
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="-96" x2="0" y2="104">
      <stop offset="0%" stop-color="#a8fff0"/>
      <stop offset="45%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="36" fill="url(#bg)"/>
  <circle cx="232" cy="210" r="205" fill="url(#halo)"/>
  <line x1="372" y1="96" x2="372" y2="324" stroke="#5eead4" stroke-opacity="0.22" stroke-width="2"/>

  <!-- trident emblem: three prongs, three agents -->
  <g transform="translate(232 210)" filter="url(#soft)">
    <circle r="118" fill="none" stroke="#5eead4" stroke-opacity="0.22" stroke-width="2"/>
    <circle r="132" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5"/>
    <g stroke="url(#steel)" stroke-linecap="round" fill="none">
      <path d="M-60 -18h120" stroke-width="13"/>
      <path d="M0 -70V88" stroke-width="14"/>
      <path d="M-60 -18v-56" stroke-width="12"/>
      <path d="M60 -18v-56" stroke-width="12"/>
      <path d="M-19 62h38" stroke-width="9"/>
    </g>
    <path d="M0 -102l15 34h-30z" fill="#a8fff0"/>
    <path d="M-60 -88l14 28h-28z" fill="#5eead4"/>
    <path d="M60 -88l14 28H46z" fill="#38bdf8"/>
    <circle cx="-60" cy="-18" r="7" fill="#5eead4"/>
    <circle cx="60" cy="-18" r="7" fill="#38bdf8"/>
    <circle cx="0" cy="-18" r="8.5" fill="#a8fff0"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(424 0)" font-family="'Segoe UI', Verdana, Geneva, sans-serif">
    <text x="0" y="152" font-size="72" letter-spacing="1"><tspan fill="#f0fffb" font-weight="700">Trident</tspan><tspan fill="#5eead4" font-weight="300" dx="18">SecOps</tspan></text>
    <text x="2" y="200" fill="#8fd9e8" font-size="22" font-weight="500" letter-spacing="3">24 SECURITY AGENT SKILLS · ONE TREE · THREE AGENTS</text>
    <text x="2" y="248" fill="#5c8a99" font-size="18" font-weight="500" letter-spacing="1.4">Offensive labs · Defense ops · Detection engineering · Secure code</text>
  </g>

  <!-- compatibility badges -->
  <g transform="translate(424 282)" font-family="'Segoe UI', Verdana, Geneva, sans-serif" font-size="19" font-weight="600">

    <!-- Gemini: four-pointed star -->
    <g>
      <rect width="212" height="58" rx="29" fill="#0d2a3d" stroke="#5eead4" stroke-opacity="0.45" stroke-width="1.8"/>
      <path d="M36 15C36 22 43 29 50 29 43 29 36 36 36 43 36 36 29 29 22 29 29 29 36 22 36 15Z" fill="#8ab4f8"/>
      <text x="64" y="36" fill="#dffaf4">Gemini CLI</text>
    </g>

    <!-- Claude: radial burst -->
    <g transform="translate(228 0)">
      <rect width="228" height="58" rx="29" fill="#0d2a3d" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.8"/>
      <g stroke="#e8875a" stroke-width="2.6" stroke-linecap="round">
        <line x1="36" y1="16" x2="36" y2="23"/>
        <line x1="36" y1="35" x2="36" y2="42"/>
        <line x1="23" y1="29" x2="30" y2="29"/>
        <line x1="42" y1="29" x2="49" y2="29"/>
        <line x1="26.8" y1="19.8" x2="31.8" y2="24.8"/>
        <line x1="40.2" y1="33.2" x2="45.2" y2="38.2"/>
        <line x1="45.2" y1="19.8" x2="40.2" y2="24.8"/>
        <line x1="31.8" y1="33.2" x2="26.8" y2="38.2"/>
      </g>
      <circle cx="36" cy="29" r="3" fill="#e8875a"/>
      <text x="64" y="36" fill="#dffaf4">Claude Code</text>
    </g>

    <!-- Codex: six-fold knot -->
    <g transform="translate(472 0)">
      <rect width="184" height="58" rx="29" fill="#0d2a3d" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.8"/>
      <g fill="none" stroke="#dcdcdc" stroke-width="2.2" transform="translate(36 29)">
        <ellipse rx="13" ry="6.5"/>
        <ellipse rx="13" ry="6.5" transform="rotate(60)"/>
        <ellipse rx="13" ry="6.5" transform="rotate(120)"/>
      </g>
      <text x="64" y="36" fill="#dffaf4">Codex</text>
    </g>
  </g>

  <text x="424" y="376" fill="#43707f" font-family="'Segoe UI', Verdana, Geneva, sans-serif" font-size="14" letter-spacing="0.6">
    Compatible with the agents above. Not affiliated with or endorsed by Google, Anthropic, or OpenAI.
  </text>
</svg>
