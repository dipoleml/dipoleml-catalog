<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" font-family="Helvetica, Arial, sans-serif">
<rect width="1200" height="650" fill="#FAF9F5"/>
<rect x="20" y="20" width="1160" height="610" rx="22" fill="#F5F4ED" stroke="#DFDDD4"/>
<text x="52" y="68" fill="#1F1E1D" font-size="26" font-weight="700">The same update, made useful</text>
<text x="52" y="94" fill="#73726C" font-size="14">A skill pack turns implementation detail into a clear operational answer.</text>

<rect x="52" y="130" width="530" height="450" rx="16" fill="#FFFFFF" stroke="#DFDDD4"/>
<text x="80" y="172" fill="#A95643" font-size="13" font-weight="700" letter-spacing="1.2">WITHOUT THE PACK</text>
<line x1="80" y1="188" x2="554" y2="188" stroke="#E6E3DA"/>
<text x="80" y="226" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">Hotfix deployed: session TTL misconfig in</text>
<text x="80" y="247" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">auth middleware caused 401 cascades after</text>
<text x="80" y="268" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">key rotation; patched the refresh path,</text>
<text x="80" y="289" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">invalidated stale JWTs, redeployed api+web</text>
<text x="80" y="310" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">on a1b2c3d. p95 back to 180ms after the CDN</text>
<text x="80" y="331" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">cache purge. Root cause: env drift between</text>
<text x="80" y="352" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">staging and prod after the 09-14 rollout;</text>
<text x="80" y="373" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">added a drift check to CI (e4f5a6b). Two</text>
<text x="80" y="394" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">flaky e2e specs quarantined (known,</text>
<text x="80" y="415" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">tracked). Dependabot queue drained,</text>
<text x="80" y="436" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">lockfile regenerated, transitive CVE closed</text>
<text x="80" y="457" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">via starlette bump. Tail: drained the old</text>
<text x="80" y="478" fill="#5F5E59" font-size="13" font-family="Menlo, Consolas, monospace">session cache, so the next deploy is clean.</text>
<rect x="80" y="512" width="474" height="42" rx="10" fill="#F7EEE9"/>
<text x="96" y="538" fill="#845545" font-size="13" font-weight="600">Everything may be true. It still misses the point.</text>

<rect x="618" y="130" width="530" height="450" rx="16" fill="#FFFFFF" stroke="#DFDDD4"/>
<text x="646" y="172" fill="#5E8769" font-size="13" font-weight="700" letter-spacing="1.2">WITH THE PACK</text>
<line x1="646" y1="188" x2="1120" y2="188" stroke="#E6E3DA"/>
<text x="646" y="224" fill="#1F1E1D" font-size="15" font-weight="600">People can sign in again. A bug was logging people</text>
<text x="646" y="246" fill="#1F1E1D" font-size="15">out because their sessions expired far too early.</text>
<text x="646" y="268" fill="#1F1E1D" font-size="15">The fix is live for everyone.</text>

<rect x="646" y="296" width="474" height="40" rx="10" fill="#F7F6F1" stroke="#E6E3DA"/>
<text x="664" y="322" font-size="14">✅</text>
<text x="692" y="322" fill="#4F4E49" font-size="14">Response times are back to normal</text>
<rect x="646" y="344" width="474" height="58" rx="10" fill="#F7EEE9" stroke="#EFE0D8"/>
<text x="664" y="368" font-size="14">⚠️</text>
<text x="692" y="368" fill="#4F4E49" font-size="14">Until this shipped, people were being logged out</text>
<text x="692" y="388" fill="#4F4E49" font-size="14">over and over.</text>

<text x="646" y="424" fill="#1F1E1D" font-size="14" font-weight="700">Verdict</text>
<line x1="646" y1="436" x2="1120" y2="436" stroke="#E6E3DA"/>
<text x="646" y="460" fill="#73726C" font-size="13.5">Fully done?</text>
<text x="1120" y="460" fill="#1F1E1D" font-size="13.5" font-weight="600" text-anchor="end">Yes</text>
<line x1="646" y1="472" x2="1120" y2="472" stroke="#EFEDE5"/>
<text x="646" y="492" fill="#73726C" font-size="13.5">Anything needed from you?</text>
<text x="1120" y="492" fill="#1F1E1D" font-size="13.5" font-weight="600" text-anchor="end">No</text>
<line x1="646" y1="504" x2="1120" y2="504" stroke="#EFEDE5"/>
<text x="646" y="524" fill="#73726C" font-size="13.5">New debt?</text>
<text x="1120" y="524" fill="#1F1E1D" font-size="13.5" font-weight="600" text-anchor="end">Two small ones, written down</text>
<line x1="646" y1="536" x2="1120" y2="536" stroke="#EFEDE5"/>
<text x="646" y="556" fill="#73726C" font-size="13.5">Safe to close?</text>
<text x="1120" y="556" fill="#1F1E1D" font-size="13.5" font-weight="600" text-anchor="end">Yes</text>
</svg>
