pre-commit:
  piped: true
  jobs:
    - name: knip
      run: bun scripts/project-bun.ts run knip
    - name: oxfmt
      run: bun scripts/project-bun.ts x oxfmt --no-error-on-unmatched-pattern {staged_files}
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,json,jsonc,css}"
      stage_fixed: true
    - name: oxlint
      run: bun scripts/project-bun.ts x oxlint --no-error-on-unmatched-pattern {staged_files}
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts}"
    - name: build
      run: bun scripts/project-bun.ts run build && git add -A dist/

pre-push:
  jobs:
    - name: check
      exclude:
        - "*.md"
        - "**/*.md"
        - "*.yml"
        - "**/*.yml"
        - "*.yaml"
        - "**/*.yaml"
      run: bun scripts/project-bun.ts run check
