<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Millionaire Quiz</title>
<style>
  :root { --bg: #0b1030; --panel: #151d4d; --gold: #f2c94c; --text: #f5f5f7; --dim: #9aa3d9; --ok: #2ecc71; --bad: #e74c3c; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Georgia, serif; }
  .wrap { display: grid; grid-template-columns: 1fr 220px; gap: 24px; max-width: 980px; margin: 24px auto; padding: 0 16px; }
  .panel { background: var(--panel); border-radius: 12px; padding: 20px; }
  .q { font-size: 22px; min-height: 90px; margin-bottom: 18px; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .a { border: 2px solid var(--dim); border-radius: 30px; padding: 12px 16px; font-size: 18px; cursor: pointer; background: transparent; color: var(--text); text-align: left; }
  .a.hidden { visibility: hidden; }
  .a.correct { border-color: var(--ok); background: rgba(46,204,113,.2); }
  .a.wrong { border-color: var(--bad); background: rgba(231,76,60,.2); }
  .key { color: var(--gold); margin-right: 8px; }
  .ladder { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .ladder li { padding: 3px 8px; border-radius: 6px; color: var(--dim); }
  .ladder li.safe { color: var(--text); }
  .ladder li.current { background: var(--gold); color: #000; font-weight: bold; }
  .bar { display: flex; gap: 12px; align-items: center; margin-top: 16px; color: var(--dim); font-size: 14px; }
  .lifeline { border: 1px solid var(--gold); color: var(--gold); border-radius: 20px; padding: 6px 12px; cursor: pointer; background: transparent; }
  .lifeline:disabled { opacity: .35; cursor: default; }
  .status { font-size: 26px; color: var(--gold); margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="q" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="bar">
      <button class="lifeline" id="fifty">5 · 50:50</button>
      <span id="meta"></span>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="panel"><ol class="ladder" id="ladder" reversed></ol></div>
</div>
<script>
const PRIZES = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 250000, 500000, 1000000];
const SAFE = new Set([5, 10, 15]);
const S = { ladder: 0, level: 0, status: "loading", fifty: true, answers: {}, correctKey: "", winnings: 0, history: [] };
let QUESTIONS = [];
function shuffle(a, seed) { let x = seed; for (let i = a.length - 1; i > 0; i--) { x = (x * 9301 + 49297) % 233280; const j = Math.floor(x / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 16777619) >>> 0; } return h; }
function render() {
  const q = QUESTIONS[S.level];
  document.getElementById("question").textContent = q ? `Q${S.level + 1} (${q.difficulty}, ${q.category}): ${q.question}` : "";
  const box = document.getElementById("answers"); box.innerHTML = "";
  for (const key of ["1", "2", "3", "4"]) {
    const b = document.createElement("button"); b.className = "a" + (S.answers[key] === undefined ? " hidden" : ""); b.dataset.key = key;
    const k = document.createElement("span"); k.className = "key"; k.textContent = key; b.append(k, S.answers[key] ?? ""); b.onclick = () => answer(key); box.appendChild(b);
  }
  const ladder = document.getElementById("ladder"); ladder.innerHTML = "";
  PRIZES.slice().reverse().forEach((p, i) => { const lvl = 15 - i; const li = document.createElement("li"); li.textContent = `${lvl}. $${p.toLocaleString()}`;
    if (SAFE.has(lvl)) li.classList.add("safe"); if (lvl === S.level + 1 && S.status === "playing") li.classList.add("current"); ladder.appendChild(li); });
  document.getElementById("fifty").disabled = !S.fifty || S.status !== "playing";
  document.getElementById("meta").textContent = `level ${S.level + 1}/15 · winnings if wrong: $${safeWinnings().toLocaleString()}`;
  document.getElementById("status").textContent = S.status === "won" ? `You won $1,000,000` : S.status === "lost" ? `Wrong. You leave with $${S.winnings.toLocaleString()}` : "";
  window.__state = JSON.stringify({ level: S.level + 1, prize_for_this_question: PRIZES[S.level], difficulty: q?.difficulty, category: q?.category,
    question: q?.question, answers: S.answers, fifty_fifty_available: S.fifty, status: S.status, winnings: S.winnings, history: S.history });
}
function safeWinnings() { let w = 0; for (const s of SAFE) if (S.level >= s) w = Math.max(w, PRIZES[s - 1]); return w; }
function load(level) {
  const q = QUESTIONS[level]; const opts = shuffle([q.correct, ...q.incorrect], S.ladder * 1000 + level * 7 + 3 + hash(q.question));
  S.answers = {}; opts.forEach((t, i) => { S.answers[String(i + 1)] = t; if (t === q.correct) S.correctKey = String(i + 1); });
  S.status = "playing"; render();
}
function answer(key) {
  if (S.status !== "playing" || S.answers[key] === undefined) return;
  const ok = key === S.correctKey; S.history.push({ level: S.level + 1, chosen: S.answers[key], correct: ok });
  document.querySelector(`[data-key="${key}"]`).classList.add(ok ? "correct" : "wrong");
  if (ok) { S.winnings = PRIZES[S.level]; if (S.level === 14) { S.status = "won"; render(); return; } S.level += 1; S.status = "loading"; render(); setTimeout(() => load(S.level), 250); }
  else { S.winnings = safeWinnings(); S.status = "lost"; render(); }
}
function fifty() {
  if (!S.fifty || S.status !== "playing") return; S.fifty = false;
  const wrong = Object.keys(S.answers).filter(k => k !== S.correctKey); shuffle(wrong, S.ladder * 1000 + S.level + 11 + hash(QUESTIONS[S.level].question)).slice(0, 2).forEach(k => delete S.answers[k]); render();
}
document.getElementById("fifty").onclick = fifty;
document.addEventListener("keydown", e => { if (["1", "2", "3", "4"].includes(e.key)) answer(e.key); if (e.key === "5") fifty(); });
fetch("questions.json").then(r => r.json()).then(banks => { const ladder = Number(new URLSearchParams(location.search).get("ladder") || 0); QUESTIONS = Array.isArray(banks[0]) ? banks[ladder % banks.length] : banks; S.ladder = ladder; S.level = 0; S.winnings = 0; S.history = []; S.fifty = true; load(0); });
</script>
</body>
</html>
